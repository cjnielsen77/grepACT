
name: grepACT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Bash Validation and Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check Bash syntax
        run: |
          bash -n grepACT.sh
          bash -n tests/test_basic.sh

      - name: Run ShellCheck
        run: |
          shellcheck grepACT.sh
          shellcheck tests/test_basic.sh

      - name: Run integration tests
        run: bash tests/test_basic.sh
